version: '3.8'

services:

  detector:
    container_name: detector.py
    image: ${DOCKERHUB_USERNAME}/detector:latest
    environment:
      ROBOFLOW_VERSION: ${ROBOFLOW_VERSION}
      RASPBERRY_KEY: ${RASPBERRY_KEY}
      DETECOTR_ID: ${DETECTOR_ID}
    volumes:
      - ./picture:/app/picture
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M